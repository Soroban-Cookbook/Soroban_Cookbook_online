name: Cross-Browser E2E Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E – ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # let all browsers finish even if one fails
      matrix:
        browser: [chromium, firefox, webkit]

    defaults:
      run:
        working-directory: ./documentation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.0"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('documentation/bun.lock') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers + OS deps
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build documentation
        run: bun run build

      - name: Serve built site in background
        run: |
          # Bind explicitly to IPv4 — Playwright baseURL uses 127.0.0.1.
          # Do NOT set BASE_URL here: Docusaurus treats BASE_URL as site baseUrl path.
          bun run serve -- --port 3000 --host 127.0.0.1 &
          # Wait until the server responds before running tests
          bunx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Run smoke tests (${{ matrix.browser }})
        run: bunx playwright test --project=${{ matrix.browser }}
        env:
          # Playwright base URL only (must not collide with Docusaurus BASE_URL).
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          BASE_URL: http://127.0.0.1:3000
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: documentation/playwright-report
          retention-days: 7

  e2e-summary:
    name: E2E Summary
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Check all browsers passed
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "❌ Cross-browser E2E tests failed"
            exit 1
          fi
          echo "✅ All browsers (chromium, firefox, webkit) passed smoke tests"
