[package]
name = "access-control"
version = "0.1.0"
edition = "2021"
description = "Soroban example implementing role-based access control (RBAC) with User, Manager, and Admin roles."
keywords = ["soroban", "example", "access-control"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.3"

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
