[package]
name = "token-wrapper"
version = "0.1.0"
edition = "2021"
description = "Soroban example wrapped token that charges a fee on mint/transfer via a treasury."
keywords = ["soroban", "example", "token-wrapper"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.3"

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
