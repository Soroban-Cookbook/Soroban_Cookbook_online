[package]
name = "escrow-basic"
version = "0.1.0"
edition = "2021"
description = "Soroban example two-party escrow with an arbiter that can release or refund funds."
keywords = ["soroban", "example", "escrow-basic"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.3"

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
