[package]
name = "htlc-swap"
version = "0.1.0"
edition = "2021"
description = "Soroban example hashed timelock contract (HTLC) for atomic token swaps."
keywords = ["soroban", "example", "htlc-swap"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.3"

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
