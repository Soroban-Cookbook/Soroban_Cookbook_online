[package]
name = "cross-contract"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Soroban example demonstrating cross-contract invocations between a token and a vault."
keywords = ["soroban", "example", "cross-contract"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

[[bin]]
name = "cross-contract"
path = "src/main.rs"
