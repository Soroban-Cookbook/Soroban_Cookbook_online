[package]
license = "MIT"
name = "token-transfer"
version = "0.1.0"
edition = "2021"
description = "Soroban example token contract with mint, transfer, burn, and allowance operations."
keywords = ["soroban", "example", "token-transfer"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.3"

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
