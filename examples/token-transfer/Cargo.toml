[package]
name = "token-transfer"
version = "0.1.0"
edition = "2021"
description = "Soroban example contract implementing a minimal token with balance tracking and transfers."
keywords = ["soroban", "example", "token-transfer"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
