[package]
name = "timelock-vault"
version = "0.1.0"
edition = "2021"
description = "Soroban example vault that locks tokens until a timelock, then allows the beneficiary to withdraw."
keywords = ["soroban", "example", "timelock-vault"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.3"

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
