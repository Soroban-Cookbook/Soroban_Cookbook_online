[package]
name = "authorization"
version = "0.1.0"
edition = "2021"
description = "Soroban example showing an admin-gated privileged action with an ownership check."
keywords = ["soroban", "example", "authorization"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.3"

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
