[package]
license = "MIT"
name = "counter"
version = "0.1.0"
edition = "2021"
description = "Soroban example contract maintaining an incrementable counter in instance storage."
keywords = ["soroban", "example", "counter"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.3"

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
