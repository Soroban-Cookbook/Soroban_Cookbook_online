[package]
name = "single-range-clmm"
version = "0.1.0"
edition = "2021"
description = "Educational, non-production single-range concentrated liquidity pool for Soroban."
license = "MIT"
keywords = ["soroban", "example", "concentrated-liquidity"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }
