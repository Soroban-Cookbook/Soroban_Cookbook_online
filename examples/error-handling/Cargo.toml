[package]
name = "error-handling"
version = "0.1.0"
edition = "2021"
description = "Soroban example demonstrating the contract error enum (Error) pattern for typed failures."
keywords = ["soroban", "example", "error-handling"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.3"

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
